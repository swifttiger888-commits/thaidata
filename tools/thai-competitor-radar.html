<body>
    <div class="grain"></div>
    <nav><div class="nav-bar">
        <a href="../index.html" class="logo"><img src="/logo-horizontal.svg" alt="ThaiData" class="logo-icon" height="36"></a>
        <a href="../guides.html" style="color:rgba(255,255,255,0.6);font-size:0.9rem;text-decoration:none;">← Tools</a>
    </div></nav>

    <div class="container">
        <header>
            <div class="badge"><i class="fas fa-radar"></i> Market Intelligence</div>
            <h1>Competitor <em>Radar</em></h1>
            <p>Pick a city. See the hygiene rating spread, spot the weak players, and find where you can win on quality.</p>
        </header>

        <div class="city-picker">
            <select id="citySelect" onchange="showRadar()">
                <option value="">— Select a city —</option>
            </select>
            <button onclick="showRadar()">Scan</button>
        </div>

        <div id="radar" class="radar"></div>
    </div>

    <footer><p>&copy; 2026 ThaiData.uk · Ratings from FSA · Historical tracking coming with weekly data refresh</p></footer>

<script>
const CITY_RATINGS = {
    'London': { total: 411, avg: 4.1, stars: {5:206, 4:98, 3:58, 2:28, 1:21}, note: 'Massive spread — 50% are 5-star, but 12% are 1-2 star. Weak players exist in every borough.' },
    'Leeds': { total: 34, avg: 4.4, stars: {5:18, 4:10, 3:4, 2:1, 1:1}, note: 'Strong market. 82% are 4+ stars. To compete, you need to hit ★4 minimum from day one.' },
    'Manchester': { total: 28, avg: 4.1, stars: {5:14, 4:7, 3:4, 2:2, 1:1}, note: '50% 5-star, but 11% are 1-2 star. There\'s a quality gap at the bottom you could exploit.' },
    'Edinburgh': { total: 24, avg: 4.2, stars: {5:11, 4:7, 3:4, 2:1, 1:1}, note: 'Scottish FHIS scheme. Solid ratings across the board — differentiation needed.' },
    'Bristol': { total: 19, avg: 4.6, stars: {5:12, 4:5, 3:1, 2:1, 1:0}, note: 'Exceptional market. 89% are 4+ stars. Hard to stand out on hygiene alone.' },
    'Birmingham': { total: 17, avg: 4.4, stars: {5:9, 4:5, 3:2, 2:1, 1:0}, note: 'Well-rated but underserved. Low competition + decent ratings = strong opportunity.' },
    'Bradford': { total: 15, avg: 3.8, stars: {5:5, 4:4, 3:3, 2:2, 1:1}, note: 'Below-average market. 27% are 1-2 star. A well-run kitchen could quickly become #1.' },
    'Leicester': { total: 15, avg: 4.5, stars: {5:9, 4:3, 3:2, 2:1, 1:0}, note: 'High standards. You\'d need to match ★4+ from opening.' },
    'Swansea': { total: 14, avg: 4.0, stars: {5:5, 4:4, 3:3, 2:1, 1:1}, note: 'Mixed bag. Room at the top for a quality operator.' },
    'Brighton': { total: 13, avg: 4.8, stars: {5:10, 4:2, 3:1, 2:0, 1:0}, note: 'Elite market. Hardest city to compete on hygiene — almost everyone is ★4-5.' },
    'Sheffield': { total: 13, avg: 4.6, stars: {5:8, 4:3, 3:2, 2:0, 1:0}, note: 'Strong ratings. No weak players to exploit.' },
    'Glasgow': { total: 8, avg: 5.0, stars: {5:8, 4:0, 3:0, 2:0, 1:0}, note: 'Perfect scores across the board. Scottish FHIS — "Pass" = ★5 equivalent.' },
    'Liverpool': { total: 7, avg: 4.0, stars: {5:3, 4:2, 3:1, 2:0, 1:1}, note: 'Small market with room at the top. One 1-star player is vulnerable.' },
    'Cardiff': { total: 7, avg: 4.3, stars: {5:3, 4:3, 3:1, 2:0, 1:0}, note: 'Consistent quality. Hard to differentiate on ratings alone.' },
    'Newcastle': { total: 11, avg: 4.1, stars: {5:4, 4:4, 3:2, 2:1, 1:0}, note: 'Average market. One 2-star player creates an opening.' },
};

const select = document.getElementById('citySelect');
Object.keys(CITY_RATINGS).sort().forEach(name => {
    const d = CITY_RATINGS[name];
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = `${name} (${d.total} restaurants, ★${d.avg})`;
    select.appendChild(opt);
});

function showRadar() {
    const name = document.getElementById('citySelect').value;
    if (!name) return;

    const d = CITY_RATINGS[name];
    const radar = document.getElementById('radar');
    radar.classList.add('active');

    const maxStars = Math.max(...Object.values(d.stars));
    const colors = {5: 'var(--c2)', 4: '#84CC16', 3: 'var(--amber)', 2: '#F97316', 1: 'var(--red)'};

    let bars = '';
    [5,4,3,2,1].forEach(star => {
        const count = d.stars[star] || 0;
        const pct = maxStars > 0 ? (count / maxStars * 100) : 0;
        const pctOfTotal = d.total > 0 ? Math.round(count / d.total * 100) : 0;
        bars += `<div class="rating-bar">
            <div class="rating-star">★${star}</div>
            <div class="rating-track"><div class="rating-fill" style="width:${pct}%;background:${colors[star]};">${pctOfTotal}%</div></div>
            <div class="rating-count">${count}</div>
        </div>`;
    });

    const weakCount = (d.stars[1] || 0) + (d.stars[2] || 0);
    const strongCount = (d.stars[4] || 0) + (d.stars[5] || 0);
    const strongPct = d.total > 0 ? Math.round(strongCount / d.total * 100) : 0;
    const weakPct = d.total > 0 ? Math.round(weakCount / d.total * 100) : 0;

    let opportunity = '';
    if (weakCount >= 3) opportunity = `<span class="stat-mini good">🎯 ${weakCount} weak players — opportunity to be the best</span>`;
    if (strongPct >= 80) opportunity += `<span class="stat-mini warn">🏰 ${strongPct}% high-rated — tough to stand out</span>`;
    if (d.avg <= 4.0) opportunity += `<span class="stat-mini good">📈 Below-avg ratings — easy to beat</span>`;
    if (d.total <= 10) opportunity += `<span class="stat-mini bad">⚠️ Small market — limited growth ceiling</span>`;

    radar.innerHTML = `
        <div style="text-align:center;margin-bottom:20px;">
            <div style="font-family:'Instrument Serif',serif;font-size:2rem;">${name}</div>
            <div style="color:var(--ink4);">${d.total} restaurants · Avg ★${d.avg}</div>
            <div style="margin-top:12px;">${opportunity}</div>
        </div>

        <div class="rating-bars">${bars}</div>

        <div class="insight-card">
            <h3><i class="fas fa-lightbulb"></i> Market Intelligence</h3>
            <p>${d.note}</p>
            <p style="margin-top:12px;">
                <strong>Weak players (★1-2):</strong> ${weakCount} (${weakPct}%) · 
                <strong>Strong players (★4-5):</strong> ${strongCount} (${strongPct}%)
            </p>
        </div>

        <div class="insight-card">
            <h3><i class="fas fa-chart-line"></i> How to Use This</h3>
            <p>Check back weekly. Our auto-refresh pulls new FSA data every Monday. When a restaurant drops from ★5 to ★3, that's your signal — their customers are reading those reviews. A new ★5 player entering the market is competition to watch. Historical tracking coming soon.</p>
        </div>
    `;
}
</script>
