<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Thai Restaurant Health Check | ThaiData</title>
    <meta name="description" content="10-question diagnostic for your Thai restaurant. Score your margins, hygiene, staffing, delivery strategy, and marketing. Get a personalised action plan.">
    <link rel="canonical" href="https://thaidata.uk/tools/thai-restaurant-health-check">
    <meta property="og:type" content="article"><meta property="og:title" content="Thai Restaurant Health Check"><meta property="og:description" content="How healthy is your Thai restaurant? 10 questions, instant score, action plan.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root{--c1:#0A7A6F;--c2:#10B981;--dark:#0C1220;--ink2:#334155;--ink3:#64748B;--ink4:#94A3B8;--line:rgba(255,255,255,0.1);--bg:#0C1220}
        *{box-sizing:border-box;margin:0;padding:0}img,svg,video{max-width:100%;height:auto}
        body{font-family:'Inter',system-ui,sans-serif;color:white;background:var(--bg);line-height:1.6;overflow-x:hidden}
        nav{background:var(--dark);border-bottom:1px solid var(--line);height:72px;display:flex;align-items:center}
        .nav-bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;width:100%}
        .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.3rem;color:white;text-decoration:none}
        .logo i{color:var(--c2);font-size:1.4rem}
        .container{max-width:700px;margin:0 auto;padding:40px 20px 80px}
        header{text-align:center;margin-bottom:32px}
        h1{font-family:'Instrument Serif',serif;font-size:clamp(2rem,5vw,2.8rem);font-weight:400;line-height:1.15;margin-bottom:12px}
        h1 em{font-style:italic;color:var(--c2)}
        .quiz .q{background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:12px}
        .q h3{font-size:0.95rem;margin-bottom:12px;font-weight:500}
        .q .opts{display:flex;flex-wrap:wrap;gap:8px}
        .q .opt{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);font-size:0.82rem;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--ink4);font-family:inherit}
        .q .opt:hover{border-color:var(--c2);color:white}
        .q .opt.sel{background:var(--c2);color:white;border-color:var(--c2)}
        .submit-btn{display:block;width:100%;padding:14px;background:var(--c2);color:white;border:none;border-radius:10px;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;margin-top:20px;transition:all 0.2s}
        .submit-btn:hover{background:var(--c1)}
        #results{display:none;margin-top:30px}
        .score-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border:4px solid var(--c2)}
        .score-num{font-family:'Instrument Serif',serif;font-size:3rem;color:var(--c2)}
        .score-label{text-align:center;font-size:0.9rem;color:var(--ink4);margin-bottom:24px}
        .section-score{background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
        .ss-icon{font-size:1.4rem;width:40px;text-align:center}
        .ss-info{flex:1}.ss-name{font-size:0.9rem;font-weight:600}.ss-detail{font-size:0.78rem;color:var(--ink4);margin-top:2px}
        .ss-bar{width:80px}.ss-bar-bg{height:6px;background:rgba(255,255,255,0.06);border-radius:3px}.ss-bar-fill{height:6px;border-radius:3px}
        .actions{background:rgba(16,185,129,0.04);border:1px solid rgba(16,185,129,0.15);border-radius:14px;padding:20px 24px;margin-top:20px}
        .actions h3{color:var(--c2);margin-bottom:12px;font-size:0.95rem}
        .actions li{color:var(--ink4);font-size:0.85rem;margin-bottom:8px;padding-left:4px}
        footer{text-align:center;padding:40px 0;border-top:1px solid var(--line);color:var(--ink4);font-size:0.85rem;margin-top:40px}
    </style>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Thai Restaurant Health Check","applicationCategory":"BusinessApplication","operatingSystem":"Web","url":"https://thaidata.uk/tools/thai-restaurant-health-check","offers":{"@type":"Offer","price":"0","priceCurrency":"GBP"}}</script>
</head>
<body>
    <nav><div class="nav-bar"><a href="../index.html" class="logo"><img src="/logo-horizontal.svg" alt="ThaiData" class="logo-icon" height="36"></a><a href="../#tools" style="color:rgba(255,255,255,0.6);font-size:0.9rem;text-decoration:none;">&larr; Tools</a></div></nav>
    <div class="container">
        <header><h1>Restaurant <em>Health Check</em></h1><p style="color:var(--ink4);">10 questions. 2 minutes. See where your operation is strong — and where it's bleeding.</p></header>
        <div class="quiz" id="quiz"></div>
        <button class="submit-btn" onclick="score()">Run My Health Check</button>
        <div id="results"></div>
    </div>
    <footer><p>&copy; 2026 ThaiData UK</p></footer>
    <script>
    const questions=[
        {q:'What is your current food GP margin?',opts:['Below 60%','60-69%','70-75%','Above 75%'],scores:[1,2,3,4],cat:'margins'},
        {q:'How often do you compare actual vs theoretical GP?',opts:['Never','Once a year','Quarterly','Monthly'],scores:[1,2,3,4],cat:'margins'},
        {q:'What is your FSA hygiene rating?',opts:['0-2','3','4','5'],scores:[1,2,3,4],cat:'hygiene'},
        {q:'How many of your staff are on NLW minimum rates?',opts:['All','Most (75%+)','Some (50%)','Few (under 25%)'],scores:[1,2,3,4],cat:'staffing'},
        {q:'Do you have a separate delivery menu with different pricing?',opts:['No — same prices everywhere','Thinking about it','Yes — slightly higher','Yes — priced for platform fees'],scores:[1,2,3,4],cat:'delivery'},
        {q:'What % of revenue comes from delivery platforms?',opts:['Over 40%','25-40%','10-25%','Under 10%'],scores:[1,2,3,4],cat:'delivery'},
        {q:'How often do you update your menu prices?',opts:['Haven\'t in 2+ years','Once a year','Every 6 months','Quarterly or more'],scores:[1,2,3,4],cat:'pricing'},
        {q:'Do you track ingredient price changes from suppliers?',opts:['No — I just pay the invoice','Occasionally check','Track key items','Track everything monthly'],scores:[1,2,3,4],cat:'pricing'},
        {q:'How active is your Google Business Profile?',opts:['I don\'t have one','Exists but not updated','Monthly posts','Weekly posts + review responses'],scores:[1,2,3,4],cat:'marketing'},
        {q:'How many review platforms do you actively monitor?',opts:['None','1 (TripAdvisor or Google)','2-3','3+ with response strategy'],scores:[1,2,3,4],cat:'marketing'}
    ];
    let answers=new Array(10).fill(-1);
    let html='';
    questions.forEach((q,i)=>{
        html+=`<div class="q"><h3>${i+1}. ${q.q}</h3><div class="opts">`;
        q.opts.forEach((o,j)=>{
            html+=`<button class="opt" onclick="select(${i},${j},this)">${o}</button>`;
        });
        html+=`</div></div>`;
    });
    document.getElementById('quiz').innerHTML=html;
    function select(qi,oi,btn){
        answers[qi]=questions[qi].scores[oi];
        btn.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
    }
    function score(){
        const total=answers.reduce((a,b)=>a+(b>0?b:0),0);
        const maxQ=answers.filter(a=>a>0).length*4;
        const pct=maxQ>0?Math.round((total/maxQ)*100):0;
        const cats={margins:[0,0],hygiene:[0,0],staffing:[0,0],delivery:[0,0],pricing:[0,0],marketing:[0,0]};
        questions.forEach((q,i)=>{if(answers[i]>0){cats[q.cat][0]+=answers[i];cats[q.cat][1]+=4;}});
        const catScores={};
        Object.entries(cats).forEach(([k,v])=>{catScores[k]=v[1]>0?Math.round((v[0]/v[1])*100):0;});
        let actions=[];
        if(catScores.margins<60)actions.push('Run your GP monthly — use our <a href="PROFIT_MARGIN_DEFENDER.html" style="color:var(--c2)">Profit Margin Defender</a>');
        if(catScores.hygiene<70)actions.push('Target a hygiene 5 — EHO re-inspection is free. Focus on wok station cleanliness and rice cooling logs');
        if(catScores.staffing<60)actions.push('Model your April 2026 NLW exposure — use the <a href="../index.html#tools" style="color:var(--c2)">Wage Calculator</a>');
        if(catScores.delivery<50)actions.push('Build a separate delivery menu at 15-25% higher prices. Your current approach is losing money');
        if(catScores.pricing<60)actions.push('Review menu prices quarterly. Use our <a href="../thai-restaurant-menu-pricing-uk.html" style="color:var(--c2)">Menu Pricing Guide</a> for benchmarks');
        if(catScores.marketing<50)actions.push('Post weekly on Google Business Profile and respond to every review within 48 hours');
        if(actions.length===0)actions.push('Strong across the board. Keep monitoring — the market changes fast in 2026.');

        document.getElementById('results').style.display='block';
        document.getElementById('results').innerHTML=`
            <div class="score-circle"><div class="score-num">${pct}</div></div>
            <div class="score-label">Overall Health Score · ${pct>=75?'Strong':pct>=50?'Room to improve':'Needs attention'}</div>
            ${Object.entries({margins:'💰 Margins',hygiene:'🧼 Hygiene',staffing:'👥 Staffing',delivery:'🛵 Delivery',pricing:'📋 Pricing',marketing:'📣 Marketing'}).map(([k,label])=>`
                <div class="section-score">
                    <div class="ss-icon">${label.split(' ')[0]}</div>
                    <div class="ss-info"><div class="ss-name">${label}</div><div class="ss-detail">${catScores[k]}% — ${catScores[k]>=75?'Excellent':catScores[k]>=50?'Fair':'Weak'}</div></div>
                    <div class="ss-bar"><div class="ss-bar-bg"><div class="ss-bar-fill" style="width:${catScores[k]}%;background:${catScores[k]>=75?'var(--c2)':catScores[k]>=50?'#F59E0B':'#EF4444'}"></div></div></div>
                </div>
            `).join('')}
            <div class="actions"><h3><i class="fas fa-clipboard-list"></i> Your Action Plan</h3><ul>${actions.map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
    }
    </script>
</body>
</html>
