<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiData Admin</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B6RYQZX5QX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-B6RYQZX5QX');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
:focus-visible {
            outline: 2px solid #10B981;
            outline-offset: 2px;
            border-radius: 4px;
        }
        :focus:not(:focus-visible) {
            outline: none;
        }

        img, svg, video, canvas { max-width: 100%; height: auto; }
                html { overflow-x: hidden; }
body {
        overflow-x: hidden; font-family: system-ui, sans-serif; background: #0C1220; color: white; padding: 40px 20px; }
        .wrap { max-width: 700px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: white; font-size: 0.95rem; }
        button { background: #10B981; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #059669; }
        button.danger { background: #EF4444; }
        button.danger:hover { background: #DC2626; }
        .claim { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .claim-info { flex: 1; }
        .claim-name { font-weight: 600; }
        .claim-meta { font-size: 0.8rem; color: #94A3B8; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .badge-pending { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .badge-approved { background: rgba(16,185,129,0.15); color: #10B981; }
        .enrich-line { font-size: 0.73rem; color: #64748B; margin-top: 3px; }
        .enrich-line .enrich-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; position: relative; top: -1px; }
        .enrich-dot-success { background: #10B981; }
        .enrich-dot-partial { background: #F59E0B; }
        .enrich-dot-failed { background: #EF4444; }
        .badge-closed { background: rgba(239,68,68,0.15); color: #EF4444; }
        .excluded-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; margin-left: 6px; background: rgba(239,68,68,0.15); color: #EF4444; }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .actions button { width: auto; padding: 6px 14px; font-size: 0.8rem; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-weight: 600; z-index: 1000; }
        .toast-success { background: #064e3b; color: #10B981; }
        .toast-error { background: #450a0a; color: #EF4444; }
        .hidden { display: none; }
        .view-link { color: #10B981; text-decoration: none; font-size: 0.8rem; white-space: nowrap; }
        .view-link:hover { text-decoration: underline; }
        .fsa-id-line { font-size: 0.73rem; color: #64748B; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
        .fsa-id-line code { font-family: monospace; color: #94A3B8; }
        .fsa-copy-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #94A3B8; cursor: pointer; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; }
        .fsa-copy-btn:hover { background: rgba(255,255,255,0.15); color: white; }
        .fsa-copy-btn.copied { background: rgba(16,185,129,0.15); border-color: #10B981; color: #10B981; }

        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .claim { flex-direction: column; gap: 10px; }
            .actions { flex-wrap: wrap; }
            .actions button { font-size: 0.75rem; padding: 6px 10px; }
        }

        /* Exclude modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: #1A2332; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px; padding: 28px; max-width: 440px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-box h3 { font-size: 1.1rem; margin-bottom: 6px; }
        .modal-box .modal-detail { font-size: 0.8rem; color: #64748B; margin-bottom: 16px; }
        .modal-box label { display: block; font-size: 0.8rem; color: #94A3B8; margin-bottom: 6px; }
        .modal-box textarea {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05); color: white;
            font-size: 0.9rem; resize: vertical; min-height: 60px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .modal-actions button { width: auto; padding: 8px 20px; font-size: 0.85rem; }
        .modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
        .exclude-error { color: #EF4444; font-size: 0.8rem; margin-top: 8px; display: none; }
        .exclude-error.visible { display: block; }
        .exclude-already { color: #F59E0B; font-size: 0.8rem; margin-top: 8px; display: none; }
        .exclude-already.visible { display: block; }
        #exclude-fsa-id { width: auto; min-width: 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>ThaiData Admin</h1>

        <!-- Login -->
        <div class="card" id="login-card">
            <label>Admin Password</label>
            <input type="password" id="password" placeholder="Enter admin password">
            <button onclick="login()">Login</button>
        </div>

        <!-- Panel (hidden until login) -->
        <div id="panel" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <select id="status-filter" onchange="loadClaims()" style="width:auto;">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button onclick="logout()" style="width:auto;background:transparent;border:1px solid rgba(255,255,255,0.2);">Logout</button>
            </div>

            <!-- Exclude by FSA ID -->
            <div class="card" style="margin-bottom:20px;padding:16px 20px;">
                <div style="font-size:0.85rem;color:#94A3B8;margin-bottom:8px;">Exclude by FSA ID <span id="excl-count" style="color:#EF4444;"></span></div>
                <div style="display:grid;grid-template-columns:1fr auto;grid-gap:8px;">
                    <input type="text" id="exclude-fsa-id" placeholder="FSA ID (e.g. 411519)" style="margin:0;min-width:0;">
                    <button id="exclude-by-id-btn" onclick="excludeByFsaId()" style="width:auto;margin:0;background:#EF4444;">Exclude</button>
                </div>
                <div id="exclude-error" class="exclude-error"></div>
                <div id="exclude-already" class="exclude-already"></div>
            </div>

            <div id="claims-list"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Exclude confirmation modal -->
    <div id="exclude-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Exclude restaurant</h3>
            <div class="modal-detail" id="modal-detail"></div>
            <label for="modal-reason">Reason</label>
            <textarea id="modal-reason" placeholder="e.g. non-Thai — Indian tea shop"></textarea>
            <div class="modal-actions">
                <button onclick="closeExcludeModal()" style="background:#374151;">Cancel</button>
                <button id="modal-submit-btn" onclick="submitExclusion()" style="background:#EF4444;">Exclude</button>
            </div>
        </div>
    </div>

    <script>
    let sessionToken = null;

    function htmlEscape(str) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    function slugify(s) {
        return s.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').replace(/^-|-$/g, '');
    }

    function toast(msg, type) {
        if (type === undefined) type = 'success';
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(function() { el.remove(); }, 3000);
    }

    async function login() {
        const pw = document.getElementById('password').value;
        try {
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw }),
            });
            const data = await res.json();
            if (res.ok) {
                sessionToken = data.token;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('panel').classList.remove('hidden');
                loadClaims();
            } else {
                toast(data.error || 'Invalid password', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    function logout() {
        sessionToken = null;
        document.getElementById('login-card').classList.remove('hidden');
        document.getElementById('panel').classList.add('hidden');
    }

    async function loadClaims() {
        const status = document.getElementById('status-filter').value;
        try {
            const [claimsRes, exclRes] = await Promise.all([
                fetch('/api/admin?status=' + encodeURIComponent(status), {
                    headers: { 'Authorization': 'Bearer ' + sessionToken },
                }),
                fetch('/api/admin/exclusions', {
                    headers: { 'Authorization': 'Bearer ' + sessionToken },
                }),
            ]);
            const data = await claimsRes.json();
            const exclData = exclRes.ok ? await exclRes.json() : { exclusions: [] };
            window._excludedIds = new Set((exclData.exclusions || []).filter(e => !e.restored_at).map(e => e.fsa_id));
            window._allClaims = data.claims;
            var countEl = document.getElementById('excl-count');
            if (countEl && window._excludedIds.size > 0) {
                countEl.textContent = '(' + window._excludedIds.size + ' excluded)';
            } else if (countEl) {
                countEl.textContent = '';
            }
            const list = document.getElementById('claims-list');
            list.textContent = '';

            if (!data.claims || data.claims.length === 0) {
                var emptyMsg = document.createElement('p');
                emptyMsg.style.color = '#94A3B8';
                emptyMsg.textContent = 'No claims found.';
                list.appendChild(emptyMsg);
                return;
            }

            for (var ci = 0; ci < data.claims.length; ci++) {
                let c = data.claims[ci];
                var claimRow = document.createElement('div');
                claimRow.className = 'claim';

                var infoDiv = document.createElement('div');
                infoDiv.className = 'claim-info';

                var nameDiv = document.createElement('div');
                nameDiv.className = 'claim-name';
                nameDiv.textContent = c.restaurant_name;
                infoDiv.appendChild(nameDiv);

                var metaDiv = document.createElement('div');
                metaDiv.className = 'claim-meta';
                var dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString() : '';
                metaDiv.textContent = c.city + ' \u00b7 ' + c.claimer_email + ' \u00b7 ' + dateStr;
                infoDiv.appendChild(metaDiv);

                // FSA ID label with copy button
                if (c.fsa_id) {
                    var fsaLine = document.createElement('div');
                    fsaLine.className = 'fsa-id-line';
                    var fsaCode = document.createElement('code');
                    fsaCode.textContent = 'FSA ID: ' + c.fsa_id;
                    fsaLine.appendChild(fsaCode);
                    let copyBtn = document.createElement('button');
                    copyBtn.className = 'fsa-copy-btn';
                    copyBtn.textContent = 'Copy';
                    copyBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        navigator.clipboard.writeText(String(c.fsa_id)).then(function() {
                            copyBtn.textContent = 'Copied!';
                            copyBtn.classList.add('copied');
                            setTimeout(function() { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
                        });
                    });
                    fsaLine.appendChild(copyBtn);
                    infoDiv.appendChild(fsaLine);
                }

                var badgeSpan = document.createElement('span');
                badgeSpan.className = 'badge badge-' + c.claim_status;
                badgeSpan.textContent = c.claim_status;
                infoDiv.appendChild(badgeSpan);

                if (c.is_closed) {
                    var closedBadge = document.createElement('span');
                    closedBadge.className = 'badge';
                    closedBadge.style.cssText = 'background:rgba(239,68,68,0.15);color:#EF4444;margin-left:6px;';
                    closedBadge.textContent = 'closed';
                    infoDiv.appendChild(closedBadge);
                }

                // Exclusion status badge
                if (c.fsa_id && window._excludedIds && (window._excludedIds.has(c.fsa_id) || window._excludedIds.has(Number(c.fsa_id)))) {
                    var exclBadge = document.createElement('span');
                    exclBadge.className = 'excluded-badge';
                    exclBadge.textContent = 'excluded';
                    infoDiv.appendChild(exclBadge);
                }

                // Enrichment status line (read-only, parsed client-side)
                if (c.enrichment) {
                    try {
                        var enr = typeof c.enrichment === 'string' ? JSON.parse(c.enrichment) : c.enrichment;
                        if (enr && enr.status) {
                            var dotClass = 'enrich-dot-' + enr.status;
                            var scrapedDate = enr.scraped_at ? new Date(enr.scraped_at).toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '';
                            var domain = '';
                            try { domain = new URL(enr.source_url || '').hostname.replace(/^www\./,''); } catch(e) {}
                            var fieldCount = (enr.fields && Array.isArray(enr.fields)) ? enr.fields.length : 0;
                            var fieldLabel = fieldCount === 1 ? '1 field' : fieldCount + ' fields';

                            var enrichDiv = document.createElement('div');
                            enrichDiv.className = 'enrich-line';
                            var dot = document.createElement('span');
                            dot.className = 'enrich-dot ' + dotClass;
                            enrichDiv.appendChild(dot);
                            enrichDiv.appendChild(document.createTextNode(
                                'Enrichment: ' + enr.status + ' · scraped ' + scrapedDate + ' · ' + domain + ' · ' + fieldLabel
                            ));
                            infoDiv.appendChild(enrichDiv);
                        }
                    } catch(e) { /* malformed enrichment — hide silently */ }
                }

                claimRow.appendChild(infoDiv);

                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                if (c.claim_status === 'pending') {
                    var approveBtn = document.createElement('button');
                    approveBtn.style.background = '#10B981';
                    approveBtn.textContent = 'Approve';
                    approveBtn.addEventListener('click', (function(id) {
                        return function() { approveClaim(id); };
                    })(c.id));
                    actionsDiv.appendChild(approveBtn);

                    var rejectBtn = document.createElement('button');
                    rejectBtn.className = 'danger';
                    rejectBtn.textContent = 'Reject';
                    rejectBtn.addEventListener('click', (function(id) {
                        return function() { rejectClaim(id); };
                    })(c.id));
                    actionsDiv.appendChild(rejectBtn);
                }

                var viewBtn = document.createElement('button');
                viewBtn.style.background = 'transparent';
                viewBtn.style.border = '1px solid rgba(255,255,255,0.15)';
                viewBtn.textContent = 'View';
                viewBtn.title = 'Open public listing page';
                var pageUrl = c.page_url || ('/r/' + slugify(c.city) + '/' + slugify(c.restaurant_name) + '/');
                viewBtn.addEventListener('click', (function(url) {
                    return function() { window.open(url, '_blank'); };
                })(pageUrl));
                actionsDiv.appendChild(viewBtn);

                var deleteBtn = document.createElement('button');
                if (c.claim_status === 'pending') {
                    deleteBtn.className = 'danger';
                    deleteBtn.textContent = 'Remove permanently';
                    deleteBtn.setAttribute('data-claim-id', c.id);
                    deleteBtn.setAttribute('data-name', c.restaurant_name);
                    deleteBtn.addEventListener('click', function(e) {
                        var btn = e.currentTarget;
                        var id = parseInt(btn.getAttribute('data-claim-id'));
                        var name = btn.getAttribute('data-name');
                        deleteClaim(id, name);
                    });
                } else if (c.claim_status === 'approved') {
                    deleteBtn.style.background = '#F59E0B';
                    deleteBtn.textContent = 'Reset listing';
                    deleteBtn.title = 'Clear owner data and reopen for re-review';
                    deleteBtn.addEventListener('click', (function(id) {
                        return function() { actionClaim(id, 'reset'); };
                    })(c.id));
                } else if (c.claim_status === 'rejected') {
                    deleteBtn.style.background = '#64748B';
                    deleteBtn.textContent = 'Reopen claim';
                    deleteBtn.title = 'Reopen for re-review';
                    deleteBtn.addEventListener('click', (function(id) {
                        return function() { actionClaim(id, 'reopen'); };
                    })(c.id));
                }
                actionsDiv.appendChild(deleteBtn);

                // Closed toggle (approved claims only — needs a listing)
                if (c.claim_status === 'approved' && c.listing_id) {
                    var closedBtn = document.createElement('button');
                    if (c.is_closed) {
                        closedBtn.style.background = '#10B981';
                        closedBtn.textContent = 'Reopen venue';
                        closedBtn.title = 'Mark venue as open again';
                    } else {
                        closedBtn.style.background = '#EF4444';
                        closedBtn.textContent = 'Mark closed';
                        closedBtn.title = 'Mark venue as permanently closed';
                    }
                    closedBtn.addEventListener('click', (function(listingId, currentState) {
                        return function() { toggleClosed(listingId, !currentState); };
                    })(c.listing_id, c.is_closed));
                    actionsDiv.appendChild(closedBtn);
                }

                // Exclude / Restore button (needs fsa_id)
                if (c.fsa_id) {
                    var exclBtn = document.createElement('button');
                    var isExcluded = window._excludedIds && (window._excludedIds.has(c.fsa_id) || window._excludedIds.has(Number(c.fsa_id)));
                    if (isExcluded) {
                        exclBtn.style.background = '#10B981';
                        exclBtn.textContent = 'Restore';
                        exclBtn.title = 'Remove exclusion — restaurant will reappear on next pipeline run';
                    } else {
                        exclBtn.style.background = '#EF4444';
                        exclBtn.textContent = 'Exclude';
                        exclBtn.title = 'Exclude from site — non-Thai or irrelevant venue';
                    }
                    exclBtn.addEventListener('click', (function(fsaId, excluded, restName, restCity) {
                        return function() {
                            if (excluded) {
                                restoreExclusion(fsaId);
                            } else {
                                showExcludeModal(fsaId, restName, restCity);
                            }
                        };
                    })(c.fsa_id, isExcluded, c.restaurant_name, c.city));
                    actionsDiv.appendChild(exclBtn);
                }

                claimRow.appendChild(actionsDiv);
                list.appendChild(claimRow);
            }
        } catch (e) {
            toast('Error loading claims', 'error');
        }
    }

    async function approveClaim(id) {
        await actionClaim(id, 'approved');
    }

    async function rejectClaim(id) {
        await actionClaim(id, 'rejected');
    }

    async function actionClaim(id, action) {
        try {
            const res = await fetch('/api/admin', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + sessionToken,
                },
                body: JSON.stringify({ claim_id: id, action: action }),
            });
            const data = await res.json();
            if (res.ok) {
                toast('Claim ' + action + '!');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    async function toggleClosed(listingId, closed) {
        try {
            const res = await fetch('/api/admin', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + sessionToken,
                },
                body: JSON.stringify({ listing_id: listingId, field: 'is_closed', value: closed ? 1 : 0 }),
            });
            const data = await res.json();
            if (res.ok) {
                toast(closed ? 'Venue marked as closed' : 'Venue reopened');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    async function deleteClaim(id, name) {
        var typed = prompt('Type "' + name + '" to confirm permanent deletion. This cannot be undone.');
        if (typed === null) return;
        if (typed.trim().toLowerCase() !== name.trim().toLowerCase()) {
            toast('Name did not match. Deletion cancelled.', 'error');
            return;
        }
        try {
            const res = await fetch('/api/admin?claim_id=' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + sessionToken },
            });
            const data = await res.json();
            if (res.ok) {
                toast('Deleted!');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    // ── Pending exclusion state ──
    let _pendingFsaId = null;

    function showExcludeModal(fsaId, name, city) {
        _pendingFsaId = fsaId;
        document.getElementById('modal-detail').innerHTML =
            '<strong>' + escapeHtml(name) + '</strong><br>' +
            escapeHtml(city) + ' · FSA ID: ' + fsaId;
        document.getElementById('modal-reason').value = '';
        document.getElementById('modal-submit-btn').disabled = false;
        document.getElementById('modal-submit-btn').textContent = 'Exclude';
        document.getElementById('exclude-modal').classList.remove('hidden');
        document.getElementById('modal-reason').focus();
    }

    function closeExcludeModal() {
        document.getElementById('exclude-modal').classList.add('hidden');
        _pendingFsaId = null;
    }

    async function submitExclusion() {
        var reason = document.getElementById('modal-reason').value.trim();
        if (!reason) {
            toast('Please enter a reason', 'error');
            return;
        }
        var btn = document.getElementById('modal-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Submitting…';
        try {
            const res = await fetch('/api/admin/exclusions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + sessionToken,
                },
                body: JSON.stringify({ fsa_id: _pendingFsaId, reason: reason }),
            });
            const data = await res.json();
            if (res.ok) {
                toast('Excluded. Will disappear on next pipeline run.');
                closeExcludeModal();
                loadClaims();
                var input = document.getElementById('exclude-fsa-id');
                if (input) input.value = '';
            } else {
                toast(data.error || 'Error', 'error');
                btn.disabled = false;
                btn.textContent = 'Exclude';
            }
        } catch (e) {
            toast('Network error', 'error');
            btn.disabled = false;
            btn.textContent = 'Exclude';
        }
    }

    function excludeByFsaId() {
        var input = document.getElementById('exclude-fsa-id');
        var fsaId = parseInt(input.value);
        var errEl = document.getElementById('exclude-error');
        var alreadyEl = document.getElementById('exclude-already');
        errEl.classList.remove('visible');
        alreadyEl.classList.remove('visible');

        if (!fsaId || fsaId <= 0) {
            errEl.textContent = 'Enter a valid FSA ID';
            errEl.classList.add('visible');
            return;
        }

        // Already excluded?
        if (window._excludedIds && (window._excludedIds.has(fsaId) || window._excludedIds.has(String(fsaId)))) {
            alreadyEl.textContent = 'FSA ID ' + fsaId + ' is already excluded.';
            alreadyEl.classList.add('visible');
            return;
        }

        // Look up in loaded claims
        var found = null;
        if (window._allClaims) {
            for (var i = 0; i < window._allClaims.length; i++) {
                if (window._allClaims[i].fsa_id == fsaId) {
                    found = window._allClaims[i];
                    break;
                }
            }
        }

        if (found) {
            showExcludeModal(fsaId, found.restaurant_name, found.city);
        } else {
            errEl.textContent = 'FSA ID ' + fsaId + ' not found. Check the ID or switch status buckets.';
            errEl.classList.add('visible');
        }
    }

    async function restoreExclusion(fsaId) {
        if (!confirm('Restore this restaurant? It will reappear on the next pipeline run.')) return;
        try {
            const res = await fetch('/api/admin/exclusions', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + sessionToken,
                },
                body: JSON.stringify({ fsa_id: fsaId }),
            });
            const data = await res.json();
            if (res.ok) {
                toast('Restored. Will reappear on next pipeline run.');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }
    </script>
</body>
