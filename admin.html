<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiData Admin</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B6RYQZX5QX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-B6RYQZX5QX');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
:focus-visible {
            outline: 2px solid #10B981;
            outline-offset: 2px;
            border-radius: 4px;
        }
        :focus:not(:focus-visible) {
            outline: none;
        }

        img, svg, video, canvas { max-width: 100%; height: auto; }
                html { overflow-x: hidden; }
body {
        overflow-x: hidden; font-family: system-ui, sans-serif; background: #0C1220; color: white; padding: 40px 20px; }
        .wrap { max-width: 700px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: white; font-size: 0.95rem; }
        button { background: #10B981; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #059669; }
        button.danger { background: #EF4444; }
        button.danger:hover { background: #DC2626; }
        .claim { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .claim-info { flex: 1; }
        .claim-name { font-weight: 600; }
        .claim-meta { font-size: 0.8rem; color: #94A3B8; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .badge-pending { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .badge-approved { background: rgba(16,185,129,0.15); color: #10B981; }
        .enrich-line { font-size: 0.73rem; color: #64748B; margin-top: 3px; }
        .enrich-line .enrich-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; position: relative; top: -1px; }
        .enrich-dot-success { background: #10B981; }
        .enrich-dot-partial { background: #F59E0B; }
        .enrich-dot-failed { background: #EF4444; }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .actions button { width: auto; padding: 6px 14px; font-size: 0.8rem; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-weight: 600; z-index: 1000; }
        .toast-success { background: #064e3b; color: #10B981; }
        .toast-error { background: #450a0a; color: #EF4444; }
        .hidden { display: none; }
        .view-link { color: #10B981; text-decoration: none; font-size: 0.8rem; white-space: nowrap; }
        .view-link:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .claim { flex-direction: column; gap: 10px; }
            .actions { flex-wrap: wrap; }
            .actions button { font-size: 0.75rem; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>ThaiData Admin</h1>

        <!-- Login -->
        <div class="card" id="login-card">
            <label>Admin Password</label>
            <input type="password" id="password" placeholder="Enter admin password">
            <button onclick="login()">Login</button>
        </div>

        <!-- Panel (hidden until login) -->
        <div id="panel" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <select id="status-filter" onchange="loadClaims()" style="width:auto;">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <button onclick="logout()" style="width:auto;background:transparent;border:1px solid rgba(255,255,255,0.2);">Logout</button>
            </div>
            <div id="claims-list"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
    let sessionToken = null;

    function htmlEscape(str) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    function slugify(s) {
        return s.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').replace(/^-|-$/g, '');
    }

    function toast(msg, type) {
        if (type === undefined) type = 'success';
        const el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(function() { el.remove(); }, 3000);
    }

    async function login() {
        const pw = document.getElementById('password').value;
        try {
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw }),
            });
            const data = await res.json();
            if (res.ok) {
                sessionToken = data.token;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('panel').classList.remove('hidden');
                loadClaims();
            } else {
                toast(data.error || 'Invalid password', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    function logout() {
        sessionToken = null;
        document.getElementById('login-card').classList.remove('hidden');
        document.getElementById('panel').classList.add('hidden');
    }

    async function loadClaims() {
        const status = document.getElementById('status-filter').value;
        try {
            const res = await fetch('/api/admin?status=' + encodeURIComponent(status), {
                headers: { 'Authorization': 'Bearer ' + sessionToken },
            });
            const data = await res.json();
            const list = document.getElementById('claims-list');
            list.textContent = '';

            if (!data.claims || data.claims.length === 0) {
                var emptyMsg = document.createElement('p');
                emptyMsg.style.color = '#94A3B8';
                emptyMsg.textContent = 'No claims found.';
                list.appendChild(emptyMsg);
                return;
            }

            for (var ci = 0; ci < data.claims.length; ci++) {
                var c = data.claims[ci];
                var claimRow = document.createElement('div');
                claimRow.className = 'claim';

                var infoDiv = document.createElement('div');
                infoDiv.className = 'claim-info';

                var nameDiv = document.createElement('div');
                nameDiv.className = 'claim-name';
                nameDiv.textContent = c.restaurant_name;
                infoDiv.appendChild(nameDiv);

                var metaDiv = document.createElement('div');
                metaDiv.className = 'claim-meta';
                var dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString() : '';
                metaDiv.textContent = c.city + ' \u00b7 ' + c.claimer_email + ' \u00b7 ' + dateStr;
                infoDiv.appendChild(metaDiv);

                var badgeSpan = document.createElement('span');
                badgeSpan.className = 'badge badge-' + c.claim_status;
                badgeSpan.textContent = c.claim_status;
                infoDiv.appendChild(badgeSpan);

                // Enrichment status line (read-only, parsed client-side)
                if (c.enrichment) {
                    try {
                        var enr = typeof c.enrichment === 'string' ? JSON.parse(c.enrichment) : c.enrichment;
                        if (enr && enr.status) {
                            var dotClass = 'enrich-dot-' + enr.status;
                            var scrapedDate = enr.scraped_at ? new Date(enr.scraped_at).toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '';
                            var domain = '';
                            try { domain = new URL(enr.source_url || '').hostname.replace(/^www\./,''); } catch(e) {}
                            var fieldCount = (enr.fields && Array.isArray(enr.fields)) ? enr.fields.length : 0;
                            var fieldLabel = fieldCount === 1 ? '1 field' : fieldCount + ' fields';

                            var enrichDiv = document.createElement('div');
                            enrichDiv.className = 'enrich-line';
                            var dot = document.createElement('span');
                            dot.className = 'enrich-dot ' + dotClass;
                            enrichDiv.appendChild(dot);
                            enrichDiv.appendChild(document.createTextNode(
                                'Enrichment: ' + enr.status + ' · scraped ' + scrapedDate + ' · ' + domain + ' · ' + fieldLabel
                            ));
                            infoDiv.appendChild(enrichDiv);
                        }
                    } catch(e) { /* malformed enrichment — hide silently */ }
                }

                claimRow.appendChild(infoDiv);

                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                if (c.claim_status === 'pending') {
                    var approveBtn = document.createElement('button');
                    approveBtn.style.background = '#10B981';
                    approveBtn.textContent = 'Approve';
                    approveBtn.addEventListener('click', (function(id) {
                        return function() { approveClaim(id); };
                    })(c.id));
                    actionsDiv.appendChild(approveBtn);

                    var rejectBtn = document.createElement('button');
                    rejectBtn.className = 'danger';
                    rejectBtn.textContent = 'Reject';
                    rejectBtn.addEventListener('click', (function(id) {
                        return function() { rejectClaim(id); };
                    })(c.id));
                    actionsDiv.appendChild(rejectBtn);
                }

                var viewBtn = document.createElement('button');
                viewBtn.style.background = 'transparent';
                viewBtn.style.border = '1px solid rgba(255,255,255,0.15)';
                viewBtn.textContent = 'View';
                viewBtn.title = 'Open public listing page';
                var pageUrl = c.page_url || ('/r/' + slugify(c.city) + '/' + slugify(c.restaurant_name) + '/');
                viewBtn.addEventListener('click', (function(url) {
                    return function() { window.open(url, '_blank'); };
                })(pageUrl));
                actionsDiv.appendChild(viewBtn);

                var deleteBtn = document.createElement('button');
                if (c.claim_status === 'pending') {
                    deleteBtn.className = 'danger';
                    deleteBtn.textContent = 'Remove permanently';
                    deleteBtn.setAttribute('data-claim-id', c.id);
                    deleteBtn.setAttribute('data-name', c.restaurant_name);
                    deleteBtn.addEventListener('click', function(e) {
                        var btn = e.currentTarget;
                        var id = parseInt(btn.getAttribute('data-claim-id'));
                        var name = btn.getAttribute('data-name');
                        deleteClaim(id, name);
                    });
                } else if (c.claim_status === 'approved') {
                    deleteBtn.style.background = '#F59E0B';
                    deleteBtn.textContent = 'Reset listing';
                    deleteBtn.title = 'Clear owner data and reopen for re-review';
                    deleteBtn.addEventListener('click', (function(id) {
                        return function() { actionClaim(id, 'reset'); };
                    })(c.id));
                } else if (c.claim_status === 'rejected') {
                    deleteBtn.style.background = '#64748B';
                    deleteBtn.textContent = 'Reopen claim';
                    deleteBtn.title = 'Reopen for re-review';
                    deleteBtn.addEventListener('click', (function(id) {
                        return function() { actionClaim(id, 'reopen'); };
                    })(c.id));
                }
                actionsDiv.appendChild(deleteBtn);

                claimRow.appendChild(actionsDiv);
                list.appendChild(claimRow);
            }
        } catch (e) {
            toast('Error loading claims', 'error');
        }
    }

    async function approveClaim(id) {
        await actionClaim(id, 'approved');
    }

    async function rejectClaim(id) {
        await actionClaim(id, 'rejected');
    }

    async function actionClaim(id, action) {
        try {
            const res = await fetch('/api/admin', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + sessionToken,
                },
                body: JSON.stringify({ claim_id: id, action: action }),
            });
            const data = await res.json();
            if (res.ok) {
                toast('Claim ' + action + '!');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }

    async function deleteClaim(id, name) {
        var typed = prompt('Type "' + name + '" to confirm permanent deletion. This cannot be undone.');
        if (typed === null) return;
        if (typed.trim().toLowerCase() !== name.trim().toLowerCase()) {
            toast('Name did not match. Deletion cancelled.', 'error');
            return;
        }
        try {
            const res = await fetch('/api/admin?claim_id=' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + sessionToken },
            });
            const data = await res.json();
            if (res.ok) {
                toast('Deleted!');
                loadClaims();
            } else {
                toast(data.error || 'Error', 'error');
            }
        } catch (e) {
            toast('Network error', 'error');
        }
    }
    </script>
</body>
</html>
